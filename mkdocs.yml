site_name: smbfence
site_description: A guarded SMB share client for Python — allowlisted paths, atomic writes, and one failure mode instead of three.
site_url: https://jlanghein.github.io/smbfence/
repo_url: https://github.com/jlanghein/smbfence
repo_name: jlanghein/smbfence
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Allowlisting paths: guide/allowlisting.md
      - Selecting entries: guide/selecting.md
      - Failure modes: guide/failures.md
      - Atomic writes: guide/writing.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jlanghein
