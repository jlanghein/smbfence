[project]
name = "smbfence"
version = "0.1.0"
description = "A guarded SMB share client: allowlisted paths, atomic writes, one failure mode"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "smbprotocol>=1.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "inline-snapshot>=0.14",
    "dirty-equals>=0.8",
    "ruff>=0.15",
    "ty>=0.0.1a10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.15",  # mkdocstrings uses it to format rendered signatures
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smbfence"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RET", "PTH", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["smbfence", "tests"]

[tool.ruff.lint.per-file-ignores]
# A fake's signature must match the Protocol it stands in for, unused args and all.
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
